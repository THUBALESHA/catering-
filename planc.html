<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THUBALESHA Catering - Plan C</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:380px;
    background:#111;
    border:3px solid #D4AF37;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 30px rgba(212,175,55,.4);
}

.header{
    background:linear-gradient(to bottom,#000,#1a1a1a);
    text-align:center;
    padding:25px;
    border-bottom:2px solid #D4AF37;
}

.brand{
    color:#D4AF37;
    font-size:18px;
    font-weight:bold;
    letter-spacing:3px;
    margin-bottom:10px;
}

.header h1{
    color:#D4AF37;
    font-size:52px;
    margin-bottom:5px;
}

.header h3{
    color:#fff;
    font-size:22px;
    margin-bottom:20px;
}

.pricing{
    width:100%;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid rgba(212,175,55,.3);
}

.row:last-child{
    border-bottom:none;
}

.row span{
    color:#fff;
    font-size:22px;
}

.price{
    color:#D4AF37 !important;
    font-size:28px !important;
    font-weight:bold;
}

.image{
    background:#000;
    padding:20px;
    text-align:center;
}

.image img{
    width:100%;
    max-height:320px;
    object-fit:contain;
    border:2px solid #D4AF37;
    border-radius:12px;
}

.cash{
    background:#111;
    text-align:center;
    padding:25px;
    border-top:2px solid #D4AF37;
    border-bottom:2px solid #D4AF37;
}

.cash h2{
    color:#fff;
    font-size:22px;
    margin-bottom:10px;
}

.cash h1{
    color:#D4AF37;
    font-size:50px;
}

.footer{
    background:#000;
    text-align:center;
    padding:20px;
}

.footer h2{
    color:#D4AF37;
    font-size:30px;
}

.footer p{
    color:#fff;
    margin-top:8px;
    font-size:20px;
}

@media(max-width:420px){
.card{
    width:100%;
}
.header h1{
    font-size:42px;
}
.cash h1{
    font-size:42px;
}
}
</style>

</head>
<body>

<div class="card">

<div class="header">

<div class="brand">
THUBALESHA CATERING
</div>

<h1>PLAN C</h1>

<h3>COW + PLAN A &amp; PLAN B</h3>

<div class="pricing">

<div class="row">
<span>Member +5 Premium</span>
<span class="price">R570</span>
</div>

<div class="row">
<span>Member +9 Premium</span>
<span class="price">R700</span>
</div>

</div>

</div>

<div class="image">
<img src="cow.png" alt="Cow Package">
</div>

<div class="cash">
<h2>FULL COW PACKAGE</h2>
<h1>Premium Catering</h1>
</div>

<div class="footer">
<h2>THUBALESHA CATERING</h2>
<p>Weddings • Funerals • Parties • Corporate Events</p>
</div>

</div>

</body>
</html>
